# Lines starting with # are comments — they are ignored when the file is loaded.
# Lines starting with ! are also comments.

# ── Application settings ──────────────────────────────────────────────────────
app.name=MyApp
app.version=1.0
app.debug=false

# ── Database settings ─────────────────────────────────────────────────────────
db.host=localhost
db.port=5432
db.name=mydb

# ── Unicode test ──────────────────────────────────────────────────────────────
# In .properties files, non-ASCII characters must be escaped as \uXXXX
# (when the file is stored with an OutputStream).
# Here "é" is é.  After loading, getProperty("cafe.name") returns "Café au Lait".
cafe.name=Café au Lait

# ── Whitespace edge cases ─────────────────────────────────────────────────────
# Leading whitespace BEFORE the value is stripped by the parser.
# Leading whitespace AFTER the = sign is ALSO stripped.
# To preserve leading spaces, escape the first space with \.
key.leading.spaces=\   three leading spaces kept
# Trailing whitespace is stripped unless escaped.
key.trimmed=   this value has no leading or trailing spaces after load

# ── Multi-line value ──────────────────────────────────────────────────────────
# A \ at the end of a line continues the value on the next line.
# Leading whitespace on the continuation line is stripped.
key.multiline=line one \
              line two \
              line three

# ── Separator styles ──────────────────────────────────────────────────────────
# Key-value pairs can use =, :, or even just a space as a separator.
key.equals=value with equals
key.colon: value with colon
key.space value with space separator
